# ==============================================================================
# Project:       0x00-uart
# File:          openocd.cfg
# Target Device: CH32V003 (QingKe RV32EC)
# Description:   OpenOCD configuration for on-chip debugging. Starts a GDB
#                server on port 3333 for use with riscv-wch-elf-gdb or the
#                VS Code cortex-debug extension.
# ==============================================================================

# ==============================================================================
# SECTION:     Adapter configuration
# ==============================================================================
# ------------------------------------------------------------------------------
# Interface — WCH-LinkE USB adapter
# ------------------------------------------------------------------------------
# The WCH-LinkE is the official WCH debug probe for CH32V series. It presents
# as a USB device and is driven by the wlinke adapter driver (not stlink, not
# jlink). The adapter firmware version is detected automatically.
# ------------------------------------------------------------------------------
adapter driver wlinke

# ------------------------------------------------------------------------------
# Clock speed — 6 MHz (safe default for CH32V003)
# ------------------------------------------------------------------------------
# The SWIO interface on the CH32V003 supports up to ~48 MHz in theory, but
# 6 MHz is the reliable default used by WCH's own tools. Higher speeds may
# cause communication errors on long cables or breadboard setups.
# ------------------------------------------------------------------------------
adapter speed 6000

# ------------------------------------------------------------------------------
# Transport — SDI (Single Debug Interface)
# ------------------------------------------------------------------------------
# The QingKe V2A core uses SDI, a single-wire debug protocol. This is NOT
# JTAG and NOT SWD — it is WCH's proprietary 1-wire transport over the SWIO
# pin. The "irlen 5" in the TAP configuration below reflects the SDI IR
# register length.
# ------------------------------------------------------------------------------
transport select sdi

# ==============================================================================
# SECTION:     Target configuration
# ==============================================================================
# ------------------------------------------------------------------------------
# WCH-LinkE address — mapped to flash base
# ------------------------------------------------------------------------------
# Tells the WCH-LinkE probe where the target memory space begins. For the
# CH32V003, code flash starts at 0x00000000 (alias of 0x08000000).
# ------------------------------------------------------------------------------
wlink_set_address 0x00000000

# ------------------------------------------------------------------------------
# TAP (Test Access Port) — SDI chain discovery
# ------------------------------------------------------------------------------
# The CH32V003 has a single RISC-V debug module on the SDI chain.
#   - chipname:   logical name for the chip
#   - irlen 5:    IR register length for QingKe SDI (fixed at 5 bits)
#   - expected-id: RISC-V debug module ID (0x00001 for QingKe V2A)
# ------------------------------------------------------------------------------
set _CHIPNAME wch_riscv
sdi newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00001

# ------------------------------------------------------------------------------
# Target — QingKe V2A RISC-V core
# ------------------------------------------------------------------------------
# Work area is the first 2 KB of SRAM starting at 0x20000000. OpenOCD uses
# this as scratch memory for flash programming algorithms and register reads.
# "backup 1" tells OpenOCD to save/restore the work area contents on
# connect/disconnect so it does not clobber SRAM.
# ------------------------------------------------------------------------------
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME.0 wch_riscv -chain-position $_TARGETNAME
$_TARGETNAME.0 configure \
    -work-area-phys 0x20000000 \
    -work-area-size 0x800 \
    -work-area-backup 1

# ==============================================================================
# SECTION:     Flash configuration
# ==============================================================================
# ------------------------------------------------------------------------------
# Flash bank — 16 KB CodeFlash at 0x00000000
# ------------------------------------------------------------------------------
# The CH32V003 has 16 KB of built-in CodeFlash (not external SPI flash).
# OpenOCD's wch_riscv flash driver handles erase/write through the internal
# flash controller. The flash is memory-mapped at 0x00000000 (alias) and
# 0x08000000 (native).
# ------------------------------------------------------------------------------
set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME wch_riscv 0x00000000 0 0 0 $_TARGETNAME.0

# ==============================================================================
# SECTION:     Ready
# ==============================================================================
# This message is matched by the VS Code tasks.json problem matcher to signal
# that OpenOCD is ready for GDB connections.
# ==============================================================================
echo "Ready for Remote Connections"
